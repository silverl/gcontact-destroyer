[project]
name = "gcontact-destroyer"
version = "0.1.0"
description = "TUI for rapidly purging Google Contacts"
requires-python = ">=3.12"
dependencies = [
    "textual>=3.0",
    "google-api-python-client",
    "google-auth-oauthlib",
    "google-auth-httplib2",
]

[project.scripts]
gcd = "gcontact_destroyer.app:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "textual-dev",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gcontact_destroyer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
